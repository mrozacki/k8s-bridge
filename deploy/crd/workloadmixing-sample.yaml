# Sample WorkloadMixing CR — a live run used exactly this shape
# (bridge started with --workloadmixing slurm-jobs/playground).
apiVersion: k8s-bridge.x-k8s.io/v1alpha1
kind: WorkloadMixing
metadata:
  name: playground
  namespace: slurm-jobs
spec:
  # This sample is the IN-CLUSTER shape (that is what the service DNS name
  # below means), so it is secure-by-default: https, and no allowInsecureHTTP.
  # A plaintext endpoint needs an explicit opt-in — the CRD's CEL rule rejects
  # http:// without it. Running the bridge from a workstation against a
  # port-forward is the one case that needs the opt-in; docs/tutorial.md patches
  # both fields there instead of weakening this file (a sample gets copied into
  # real clusters, so it must not ship the insecure combination).
  slurmRestURL: "https://slurm-restapi.slurm.svc.cluster.local:6820"
  # slurmUser is deliberately unset: empty omits the X-SLURM-USER-NAME
  # header, so slurmrestd acts as the user the JWT was minted for. Set it
  # ONLY to a user that actually exists in your Slurm cluster (e.g. a
  # dedicated low-privilege REST user) — a non-existent user makes every
  # job update fail with "Invalid user id", and the bridge can then never
  # release held jobs.
  # The chart's canonical mount point for the token Secret. It is also inside
  # the controller's default --allowed-token-paths (ADR-0017): in supervisor
  # mode a CR may only name a token path the platform admin allowed, since the
  # controller reads it from its OWN filesystem and sends it to this CR's
  # slurmRestURL. The workstation tutorial reads a token from /tmp instead,
  # which is fine there — it runs in explicit single-CR mode, where the config
  # source is admin-chosen and the allowlist deliberately does not apply.
  slurmTokenFile: "/var/run/secrets/slurm/token"
  localQueue: "team-a"
  pollInterval: "10s"
  maxUserPriority: 10000 # cap user-originated priority requests (security audit H1)
  partitionMappings:
    - partitionName: "mixing"
      workloadPriorityClass: "normal-priority"
    - partitionName: "mixing-high"
      workloadPriorityClass: "high-priority"
    - partitionName: "mixing-gpu"
      workloadPriorityClass: "gpu-priority"
  slurmd:
    image: "ghcr.io/slinkyproject/slurmd:26.05-ubuntu26.04"
    confServer: "slurm-controller.slurm.svc.cluster.local:6817"
    authSecretName: "slurm-auth-slurm"
  topology:
    preferredLevel: "example.com/block"
