{{- /*
Injects the admission-gate pin into every inner RayJob at CREATE time (the
pin-gate model, ADR-0013) — see deploy/ray-bridge/webhook.yaml for the full
rationale, which this template replicates verbatim except for making every
namespace reference .Release.Namespace-parameterized (the standalone manifest
hardcodes namespace "ray", which breaks any install into a different
namespace). Path/rules/failurePolicy match
internal/raywebhook/handler.go's webhookPath constant and
internal/raywebhook/webhook.go's Decide() rules exactly — keep the two in
sync if either changes.

This is a cluster-scoped object; its name is prefixed with the chart's
release-qualified fullname so two releases (e.g. one per team namespace)
don't collide.
*/}}
{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "ray-bridge.fullname" . }}-auto-suspend
  labels:
    {{- include "ray-bridge.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "ray-bridge.webhookCertificateName" . }}
  {{- end }}
webhooks:
  - name: auto-suspend.ray-bridge.x-k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Ignore (not Fail) on purpose for the prototype: a webhook outage must
    # not block RayJob submission cluster-wide. Tighten to Fail once the
    # webhook is proven highly available.
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Ignore" }}
    clientConfig:
      service:
        name: {{ include "ray-bridge.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-ray-io-v1-rayjob
        port: 443
    rules:
      - apiGroups: ["ray.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["rayjobs"]
        scope: Namespaced
    # Only intercept RayJobs in namespaces the bridge manages (label your
    # managed namespaces accordingly).
    namespaceSelector:
      matchLabels:
        ray-bridge.x-k8s.io/managed: "true"
{{- end }}
