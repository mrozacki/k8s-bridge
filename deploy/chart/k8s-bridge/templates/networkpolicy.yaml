{{- if .Values.networkPolicy.enabled }}
{{- /*
Default-deny egress except what the controller needs: DNS, the kube-apiserver,
and the slurmrestd endpoint. Ingress is limited to the health probe port so
kubelet can reach it. Requires a NetworkPolicy-capable CNI.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-bridge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-bridge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # kubelet health probes (and metrics scraping) originate off-pod; allow the
    # port cluster-wide rather than by pod selector.
    - ports:
        - { protocol: TCP, port: 8080 }
  egress:
    # DNS resolution.
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # kube-apiserver and slurmrestd. Narrow these to specific CIDRs/namespaces
    # for your cluster; left open by port here because the API server address is
    # cluster-specific.
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
        - { protocol: TCP, port: 6820 }
{{- end }}
