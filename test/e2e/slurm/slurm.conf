# slurm.conf for the real-Slurm kind e2e (test/e2e/run-real-slurm.sh).
#
# DESIGN GOAL: a Slurm control plane that needs NO cgroups and NO privileges
# anywhere — neither in the slurmctld/slurmrestd containers running OUTSIDE
# kind on the docker network, nor in the slurmd pods the bridge creates
# INSIDE kind. This is what lets the whole lifecycle run on a free CI runner:
# the audit's privileged-slurmd concern (run.sh header, threat-model T7) was
# about slurmd needing writable cgroups; with proctrack/pgid + task/none the
# cgroup plugins are never loaded, so nothing here asks the kernel for
# anything a default container cannot do.
#
# Deliberate differences from the live Slinky deployment
# (experiments/01-gke-playground/manifests/slurm-values.yaml):
#   - no GresTypes / gres.conf: no GPU (real or simulated) in this scope;
#   - no JobSubmitPlugins=lua: the test submits with an explicit
#     `sbatch --hold`, so the auto-hold plugin is not needed and one less
#     moving part can break;
#   - no accounting (same as live: slurmdbd disabled).
# Everything else mirrors the live values where it matters for the bridge:
# SelectType=select/cons_tres (the confirmed L1 root cause — dynamic nodes
# are ONLY supported under cons_tres), ReturnToService=2, SlurmdTimeout=60,
# TreeWidth=65533, enable_configless.

ClusterName=bridge-e2e

# SlurmctldHost by NAME, no hard-coded address. Every party resolves it
# through its own resolver:
#   - the slurmctld container itself: --hostname slurmctld (its own name);
#   - the slurmrestd container: docker's embedded DNS on the user-defined
#     "kind" network resolves sibling container names;
#   - the bridge-created slurmd pods inside kind: a selectorless Service
#     named "slurmctld" + a manual EndpointSlice (created by the runner
#     script) in the workload namespace — the pod's DNS search path expands
#     the bare name to slurmctld.<namespace>.svc.cluster.local.
# This is what makes one static file work on both sides of the kind boundary.
SlurmctldHost=slurmctld
SlurmctldPort=6817
SlurmdPort=6818

SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld

# Internal auth between daemons: auth/slurm with a per-run generated
# slurm.key (openssl rand). The SAME key is loaded into kind as Secret
# slurm-auth-slurm (key slurm.key) — translate.ToJobSet mounts exactly that
# Secret at /etc/slurm/slurm.key in every slurmd pod it creates.
# use_client_ids lets slurmrestd (running as an unprivileged local user)
# convey the REST-authenticated user's identity to slurmctld.
AuthType=auth/slurm
# CredType must be pinned to the auth flavor: run-9 finding — without it the
# credential subsystem fell back to a munge-flavored default, slurmctld
# logged `cred_p_create_net_cred: _encode() failure` / "If munged is up..."
# on every RPC toward the registered slurmd (no munged exists in these
# containers), marked the node not-responding/DOWN mid-job, and the running
# job was requeued to PENDING.
CredType=cred/slurm
AuthInfo=use_client_ids
# REST auth: auth/jwt with a per-run generated HS256 key. The bridge's token
# is minted inside the container with `scontrol token` and mounted into the
# bridge pod via the chart's slurmTokenSecret.
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key

# --- dynamic-node requirements ---
# enable_configless: the bridge's slurmd pods run `slurmd -Z --conf-server
# slurmctld:6817` and fetch this very file from slurmctld at startup.
# (run-10 finding: cloud_reg_addrs is defunct in 26.05, same fate as
# NoAddrCache — the attempted fix for the masqueraded registration address
# was ignored. The actual fix lives in the runner script instead: a nat
# POSTROUTING ACCEPT rule inside the kind node exempts pod->docker-network
# traffic from kind's MASQUERADE, so slurmd registers from its real pod IP
# and slurmctld's return path uses the pod-CIDR route directly.)
SlurmctldParameters=enable_configless
# cons_tres: dynamic registration ("slurmd -Z") is only supported under the
# cons_tres select plugin (L1 finding, slurm-values.yaml header — verified
# against upstream docs, the slurm-operator source, and a live cluster).
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
# MaxNodeCount must leave headroom above the configured node count for
# dynamic nodes to register into (the slurm-operator hardcodes 1024; a
# handful is plenty for this test's single-job scope).
MaxNodeCount=32
# ReturnToService=2: a dynamic node that vanished and re-registered must not
# stay DOWN (live finding). SlurmdTimeout=60 tightens how fast
# slurmctld notices a dead node (default 300s is too slow for a CI budget).
ReturnToService=2
SlurmdTimeout=60
JobRequeue=1
# TreeWidth=65533 disables message fanout between slurmds — the classically
# documented dynamic-node setting. Slurm 23.11+ handles fanout for dynamic
# nodes, so this is defensive, mirroring the live values file (MEDIUM
# confidence there; harmless at this scale either way).
TreeWidth=65533
# (run-1 finding, 2026-07-11: CommunicationParameters=NoAddrCache is defunct
# in Slurm 26.05 — slurmctld logs an error and ignores it — so the planned
# stale-address defense is gone. Address staleness for dynamic nodes is now
# handled only by ReturnToService=2 and the /etc/hosts re-injection in the
# runner script; if S5/S6 flake on address caching, revisit with 26.05's
# replacement mechanism.)

# Verbose slurmd/slurmstepd logging: run-14 finding — slurmstepd died on
# every launch with only `slurmstepd return code -1: Unspecified error` at
# default verbosity, which is undebuggable from the artifact. debug2 makes
# stepd narrate its setup steps (identity switch, spool dirs, IO setup) so
# the next failure names itself. Cheap at this scale (one job per run);
# revisit if this e2e ever grows a load stage.
SlurmdDebug=debug2

# --- cgroup-free process tracking (the whole point, see header) ---
ProctrackType=proctrack/pgid
TaskPlugin=task/none

SchedulerType=sched/backfill
MailProg=/bin/true

# placeholder-0 is a FUTURE node: it never runs anything and no slurmd ever
# registers for it. It exists so the `mixing` partition has nonzero
# configured capacity at submit time — with zero configured nodes slurmctld
# can reject `sbatch --hold` outright ("Requested node configuration is not
# available") before the bridge ever sees the job. The real capacity is the
# dynamic node(s) the bridge's JobSet registers at admission time; Nodes=ALL
# picks those up as they appear. Sized comfortably above the test job's
# 1 CPU / 1024 MB so submit-time validation always passes.
# NEEDS-RUNNER-VALIDATION: whether 26.05 accepts a held job into a partition
# whose only configured node is FUTURE — if not, the fallback is a
# State=CLOUD node definition instead.
NodeName=placeholder-0 CPUs=4 RealMemory=8192 State=FUTURE
PartitionName=mixing Nodes=ALL Default=YES State=UP MaxTime=UNLIMITED
