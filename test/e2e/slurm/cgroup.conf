# Served to every slurmd via configless (slurmctld ships all *.conf in
# /etc/slurm), alongside the cgroup-free slurm.conf.
#
# Run-8 finding (2026-07-11): even with ProctrackType=proctrack/pgid and
# TaskPlugin=task/none, slurmd 26.05 AUTODETECTS a cgroup plugin at startup
# and then insists on attaching slurmstepd to a systemd scope over dbus —
# `fatal: systemd scope for slurmstepd could not be set` in a container with
# no dbus socket. CgroupPlugin=disabled turns the autodetection off and is
# the missing half of this e2e's cgroup-free design (the slurm.conf half
# alone was not enough). Confirmed live: with this file served, an
# UNPRIVILEGED slurmd pod registered as a dynamic node and ran a job.
CgroupPlugin=disabled
