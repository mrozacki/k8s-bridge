# Kueue queuing topology for the playground.
#
# One ResourceFlavor (we only have one node type), one ClusterQueue holding
# the whole shared pool, and LocalQueues in the namespaces that submit work.
# Quotas are sized for 2-4 e2-standard-4 nodes; adjust with the node pool.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: spot-e2
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: main-queue
spec:
  namespaceSelector: {} # accept workloads from any namespace with a LocalQueue
  preemption:
    withinClusterQueue: LowerPriority # higher-priority workloads may evict lower ones
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: spot-e2
          resources:
            - name: cpu
              nominalQuota: 12      # leave headroom for system pods on 4 nodes
            - name: memory
              nominalQuota: 48Gi
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: main
  namespace: default
spec:
  clusterQueue: main-queue
---
# Namespace where k8s-bridge (and the manual simulation) creates slurmd JobSets.
apiVersion: v1
kind: Namespace
metadata:
  name: slurm-jobs
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: main
  namespace: slurm-jobs
spec:
  clusterQueue: main-queue
---
# Priority classes referenced by the partition mapping (see the MVD document:
# Slurm partitions map to WorkloadPriorityClasses).
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: high-priority
value: 1000
description: "Slurm 'high' partition and latency-sensitive serving"
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: normal-priority
value: 100
description: "Default for batch workloads (Slurm 'main' partition, K8s Jobs, Ray)"
---
# Referenced by the shipped sample CR's "mixing-gpu" partition
# (deploy/crd/workloadmixing-sample.yaml). It was missing until 2026-07-28,
# and the failure mode is genuinely nasty: Kueue's JobSet reconciler errors
# with `WorkloadPriorityClass "gpu-priority" not found` and NEVER creates a
# Workload, so the JobSet sits Suspended forever and the Slurm job hangs —
# while the bridge reports Ready=True and logs "created JobSet". Nothing on
# the bridge side looks wrong; the only evidence is in the Kueue controller's
# log. Found live walking the DWS section.
#
# Above high-priority on purpose: accelerator capacity is the scarce resource,
# so a queued GPU job should outrank a CPU one competing for admission.
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: gpu-priority
value: 2000
description: "Accelerator-backed Slurm partitions (mixing-gpu); scarcer resource than CPU, so ranked above high-priority"
