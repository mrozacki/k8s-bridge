# Stand-in inference service: a long-running Deployment, deliberately NOT
# queued through Kueue. It represents latency-sensitive serving that must keep
# running while batch workloads (Slurm/Ray/Jobs) fill the remaining capacity.
#
# Open question tracked in ADR-0002: should serving participate in Kueue quota
# (plain-Pod integration) or stay outside with only scheduler PriorityClasses
# protecting it? This experiment observes the "outside Kueue" baseline.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: serving-critical
value: 1000000
globalDefault: false
description: "Serving pods preempt batch pods at the kube-scheduler level"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-inference
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-inference
  template:
    metadata:
      labels:
        app: sample-inference
    spec:
      priorityClassName: serving-critical
      containers:
        - name: server
          # Placeholder for a real model server (e.g. vLLM); an HTTP echo is
          # enough to observe scheduling/preemption behaviour cheaply.
          image: ealen/echo-server:0.9.2
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "500m"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-inference
  namespace: default
spec:
  selector:
    app: sample-inference
  ports:
    - port: 80
      targetPort: 80
