# team-b filler: normal-priority batch that will BORROW team-a's idle quota.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: teamb-filler-
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: team-b
    kueue.x-k8s.io/priority-class: normal-priority
spec:
  parallelism: 4
  completions: 4
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: w
          image: busybox:1.36
          command: ["sh", "-c", "sleep 600"]
          resources:
            requests: { cpu: "2", memory: 1Gi }
            limits: { cpu: "2", memory: 1Gi }
