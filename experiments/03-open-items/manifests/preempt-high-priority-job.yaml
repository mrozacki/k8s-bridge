# Preemption drill: a high-priority batch job big enough that it cannot be
# admitted without evicting lower-priority workloads (the bridge's slurmd
# JobSet included). ClusterQueue preemption policy: LowerPriority.
# Quota is 12 CPU; 3 pods x 3 CPU = 9 CPU forces eviction when the rest of
# the quota is in use. Live finding: keep per-pod CPU <= 3 — e2-standard-4
# nodes have ~3.5 allocatable CPU, a 4-CPU pod never schedules.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: preemptor-
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: main
    kueue.x-k8s.io/priority-class: high-priority
spec:
  parallelism: 3
  completions: 3
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: hog
          image: busybox:1.36
          command: ["sh", "-c", "echo high-priority work; sleep 60"]
          resources:
            requests:
              cpu: "3"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 2Gi
