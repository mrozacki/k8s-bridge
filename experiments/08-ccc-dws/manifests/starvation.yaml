apiVersion: apps/v1
kind: Deployment
metadata:
  name: econo-starvation
  namespace: default
spec:
  replicas: 1000
  selector:
    matchLabels:
      app: ccc-econo
  template:
    metadata:
      labels:
        app: ccc-econo
    spec:
      nodeSelector:
        cloud.google.com/compute-class: econo
      containers:
      - name: probe
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
